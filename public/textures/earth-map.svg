<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!--
    程序化风格的「等距圆柱投影」世界地图，用作球体贴图。
    等距圆柱投影 = 经度均匀映射到 x，纬度均匀映射到 y：
      x = (经度 + 180) / 360 * 1024
      y = (90 - 纬度) / 180 * 512
    形状经过简化，只用于观察 UV 如何裹到球面上，不追求地理精确。
  -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082647" />
      <stop offset="0.5" stop-color="#0f4f86" />
      <stop offset="1" stop-color="#082647" />
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56a972" />
      <stop offset="0.55" stop-color="#3b8659" />
      <stop offset="1" stop-color="#2c6a47" />
    </linearGradient>
  </defs>

  <!-- 海洋 -->
  <rect width="1024" height="512" fill="url(#ocean)" />

  <!-- 经纬网：12 条经线 + 6 条纬线，用来观察纹理在球面上的走向 -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.07">
    <path d="M85 0V512M171 0V512M256 0V512M341 0V512M427 0V512M512 0V512M597 0V512M683 0V512M768 0V512M853 0V512M939 0V512" />
    <path d="M0 85H1024M0 171H1024M0 256H1024M0 341H1024M0 427H1024" />
  </g>

  <!-- 大陆 -->
  <g fill="url(#land)" stroke="#285c3d" stroke-width="2" stroke-linejoin="round">
    <!-- 北美洲 -->
    <path d="M34 71L100 55L171 51L230 60L300 75L355 114L330 140L300 170L284 185L256 213L235 205L215 180L185 171L156 119L110 95L60 85Z" />
    <!-- 南美洲 -->
    <path d="M284 233L341 227L412 270L390 310L370 341L350 380L327 412L305 400L299 384L284 284L270 260Z" />
    <!-- 非洲 -->
    <path d="M464 165L520 150L570 155L603 171L630 200L657 225L640 250L610 280L590 320L569 353L550 340L525 300L537 245L500 220L464 213L452 190Z" />
    <!-- 欧洲 -->
    <path d="M486 142L500 125L518 119L530 100L554 80L580 85L600 95L626 100L620 120L600 135L583 142L560 150L546 137L520 145Z" />
    <!-- 亚洲 -->
    <path d="M626 100L683 57L800 50L910 57L967 85L930 120L880 150L853 171L820 190L780 210L755 240L734 233L720 200L690 190L660 205L640 199L611 156L620 120Z" />
    <!-- 澳大利亚 -->
    <path d="M833 319L860 300L881 290L910 292L924 299L947 336L935 360L924 364L880 370L853 353L840 335Z" />
    <!-- 格陵兰 -->
    <path d="M300 45L340 38L380 48L390 70L370 90L335 92L310 75Z" fill="#dceeff" stroke="#b9d3ea" />
    <!-- 马达加斯加 -->
    <path d="M612 310L625 320L622 340L610 345L604 328Z" />
    <!-- 日本、英国、新西兰 -->
    <path d="M872 140L884 132L892 145L884 158L875 155Z" />
    <path d="M496 112L505 106L512 114L506 124L498 120Z" />
    <path d="M972 360L980 368L976 382L968 376Z" />
    <!-- 东南亚岛屿 -->
    <ellipse cx="840" cy="285" rx="22" ry="7" transform="rotate(-10 840 285)" />
    <ellipse cx="880" cy="292" rx="16" ry="6" transform="rotate(-8 880 292)" />
    <ellipse cx="915" cy="300" rx="18" ry="5" transform="rotate(-6 915 300)" />
  </g>

  <!-- 沙漠色块：给大陆加一点明暗变化，避免大面积纯色 -->
  <g fill="#b9a06a" opacity="0.35">
    <ellipse cx="520" cy="195" rx="58" ry="24" />
    <ellipse cx="890" cy="330" rx="42" ry="18" />
  </g>

  <!-- 极地冰盖：球体两极在纹理上会被压缩，颜色取和海洋接近的冷色 -->
  <path d="M0 0H1024V20Q900 34 768 24T512 30T256 22T0 32Z" fill="#e8f4ff" opacity="0.92" />
  <path d="M0 512L0 480Q128 462 256 476T512 470T768 478T1024 466L1024 512Z" fill="#e8f4ff" opacity="0.92" />
</svg>
